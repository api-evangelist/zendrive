method: searched
source: https://zendrive-root.bitbucket.io/ios/docs/latest/Enums/ZendriveError.html
name: Zendrive SDK error codes
description: >-
  The complete published error registry for the Zendrive SDK, transcribed verbatim from the
  first-party iOS SDK reference (ZendriveSDK 10.1.0, last updated 2024-06-25). Zendrive's
  integration surface is a mobile SDK rather than an HTTP API, so errors are delivered as an
  NSError in the kZendriveErrorDomain domain (Android: the equivalent ZendriveSDKErrorCode)
  through the completion handler of each Zendrive API call — there is no RFC 9457 envelope
  and no HTTP status mapping, because the client never speaks HTTP directly. Codes are
  grouped by the numbering the SDK itself uses: 0-3 setup/environment, 101+ runtime.
format: sdk-error-enum
envelope:
  transport: NSError / completion handler
  domain: kZendriveErrorDomain
  vehicle_tagging_domain: kZendriveVehicleTaggingErrorDomain
  fields:
  - code
  - description
  note: >-
    Every Zendrive API that can fail takes a ZendriveApiCallHandler completion block and
    reports failure through it; the SDK does not throw.
error_count: 23
errors:
- code: 0
  name: kZendriveErrorInvalidSDKKeyString
  message: SDK Key used in setup is invalid
  class: setup
- code: 1
  name: kZendriveErrorNetworkUnreachable
  message: >-
    Network not reachable. Zendrive.setup sometimes needs a network call for authentication
    and to update SDK configuration; this error is returned whenever network is unavailable
    in those scenarios.
  class: setup
- code: 2
  name: kZendriveErrorUnsupportedOSVersion
  message: Zendrive SDK does not support the OS version of the device.
  class: environment
- code: 3
  name: kZendriveErrorDeviceUnsupported
