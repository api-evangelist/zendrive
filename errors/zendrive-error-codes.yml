settings_errors:
  note: >-
    A second, separate registry — ZendriveSettingsErrorType — reports device/OS conditions
    that stop trip detection (permissions, power saver, background restrictions) through
    ZendriveSettings/ZendriveSettingsError rather than through kZendriveErrorDomain.
  reference: https://zendrive-root.bitbucket.io/ios/docs/latest/Enums/ZendriveSettingsErrorType.html
gaps:
- >-
  No HTTP-level error catalog survives. The Zendrive Analytics REST API had its own error
  documentation at docs.zendrive.com, which is now a dangling Cloudflare CNAME (403,
  "error code: 1014") — so the server-side error surface cannot be captured.
