  class: request
- code: 102
  name: kZendriveErrorInternalFailure
  message: Internal error.
  class: internal
- code: 103
  name: kZendriveErrorNotSetup
  message: >-
    ZendriveSDK is not setup. Also returned when SDK setup has started but the completion
    handler for setup has not been called yet.
  class: state
- code: 104
  name: kZendriveErrorInsurancePeriodSame
  message: >-
