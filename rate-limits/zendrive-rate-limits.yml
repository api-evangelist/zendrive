name: Zendrive rate limits
description: >-
  No rate limits are published. Zendrive's public surface is a mobile SDK, whose reference
  documents no request quota, no throttling behaviour and no rate-limit response headers —
  the SDK batches sensor data to Zendrive's servers on its own schedule and the integrator
  never issues the HTTP calls. The Analytics REST API, which is where a documented limit would
  have lived, is unreachable: docs.zendrive.com is a dangling Cloudflare CNAME (403) and every
  API host is NXDOMAIN, so nothing can be read or observed.
