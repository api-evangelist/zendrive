note: >-
  Two hard caps ARE published in the SDK reference, but they are resource limits rather than
  rate limits and are recorded here only so the zero is not mistaken for "not looked at":
  a maximum of 2 registered beacons (kZendriveErrorMaxBeaconsLimitReached, 115), and
  ZendriveConfiguration allows only one active region per application. Neither is a
  per-window request limit.
