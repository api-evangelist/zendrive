aid: zendrive
name: Zendrive
description: >-
  Zendrive Inc. was a San Francisco mobility risk intelligence company that turned an ordinary
  smartphone into a telematics sensor. Its product was a mobile SDK, not an HTTP API: an app
  embedded the Zendrive SDK, which automatically detected the start and end of every drive,
  collected accelerometer, gyroscope and GPS data with minimal battery impact, raised
  in-process callbacks for trip and collision events, and uploaded the drive for scoring.
  Fleets, rideshare operators and auto insurers consumed the resulting analytics — collision
  detection and severity, distracted driving, speeding, star ratings — through a dashboard and
  an Analytics REST API, with rideshare insurance-period modelling and a US/EU data-residency
  selector. Intuit acquired Zendrive's technology for Credit Karma's Karma Drive in 2024 and
  the developer program was shut down: as probed 2026-09-05 every Zendrive host is dead. Only
  the SDK reference, sample apps and published packages survive.
