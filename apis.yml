x-domain-status: decommissioned
x-domain-note: >-
  zendrive.com and www.zendrive.com have NO A/AAAA record — the zone is still on Cloudflare
  nameservers and still carries Google Workspace MX records, but nothing answers on HTTP.
  developers.zendrive.com, app.zendrive.com, api.zendrive.com, iql.zendrive.com and
  status.zendrive.com are NXDOMAIN. docs.zendrive.com is a dangling Cloudflare CNAME and
  returns HTTP 403 with the 17-byte body "error code: 1014" on every path, including every
  /.well-known/ and spec path. None of those 403s is a document. No Website pointer is wired,
  because the company has no live site; the Forge Global secondary-market listing that seeded
  this record is kept under x-harvest-source-url rather than as a Website, since a trading
  venue page is not a company web presence. See well-known/zendrive-well-known.yml.
