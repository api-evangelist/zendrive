name: Zendrive conformance
description: >-
  Zendrive published no machine-readable contract and no compliance program that is still
  reachable, so nearly every cross-cutting standard is honestly negative. The two positives
  are read out of the SDK reference itself rather than a marketing claim: a first-class EU/US
  data-residency selector, and an insurance-period model (Period 1/2/3) that implements the
  rideshare/TNC commercial-auto coverage-period convention used across US usage-based auto
  insurance. No certification (SOC 2, ISO 27001, PCI, HIPAA, FedRAMP) can be evidenced — the
  trust and security pages lived on zendrive.com, which no longer resolves — so no Compliance
  pointer is emitted.
