- id: eu-data-residency
  conforms: true
  evidence: >-
    ZendriveConfiguration.region accepts ZendriveRegionUS (0, default) and ZendriveRegionEU
    (1), documented as "Dictates the region where user's data will reside". Region is fixed at
    setup and cannot be switched without wipeOut; an application not provisioned for a region
    receives kZendriveErrorRegionUnsupported (109).
  url: https://zendrive-root.bitbucket.io/ios/docs/latest/Enums/ZendriveRegion.html
  note: >-
    A data-residency capability, not a GDPR certification. No DPA, SCC or privacy attestation
    is reachable.
domain_standards:
- id: usage-based-insurance-coverage-periods
  market: auto insurance / rideshare telematics
  conforms: true
  evidence: >-
    The SDK implements the standard US commercial-auto / TNC coverage-period model directly in
    its contract: ZendriveInsurance exposes startDriveWithPeriod1, startDriveWithPeriod2 and
    startDriveWithPeriod3, and ZendriveInsurancePeriod enumerates NoPeriod/Period1/Period2/
    Period3 with "Each drive belongs to exactly one of these insurance periods", guarded by
    kZendriveErrorInsurancePeriodSame (104) on a no-op transition. Period 1/2/3 is the
    rideshare/TNC industry's shared vocabulary for which policy attaches when, so an insurer
    already speaking it needs no bespoke mapping. Zendrive's reference names and numbers the
    periods but does not itself define their coverage semantics — that reading is the industry
    convention, not a Zendrive statement.
  url: https://zendrive-root.bitbucket.io/ios/docs/latest/Classes/ZendriveInsurance.html
  confidence: medium
  note: >-
    Reward-only signal read from the contract surface itself (the SDK class + enum), not from a
    marketing claim. It is a convention, not a chartered specification body.
