name: Zendrive lifecycle
description: >-
  Zendrive's developer program is decommissioned. Intuit announced on 2024-06-13 that it would
  acquire technology from Zendrive to power Credit Karma's usage-based auto-insurance product
  Karma Drive, taking on Zendrive CEO Dennis Ellis and co-founder/CTO Pankaj Risbood along with
  certain employees; the deal closed in Intuit's Q4 FY24. Every first-party publication stops
  in the same fortnight — Maven Central ZendriveSDK 10.1.0 on 2024-06-24, the iOS reference
  regenerated 2024-06-25, npm react-native-zendrive 7.0.5 on 2024-07-03 — and there has been
  no release since. The corporate and developer web presence has since been switched off
  entirely: zendrive.com and www.zendrive.com have no A record, developers.zendrive.com,
  app.zendrive.com, api.zendrive.com and iql.zendrive.com are NXDOMAIN, and docs.zendrive.com
  is a dangling Cloudflare CNAME returning 403 "error code: 1014" on every path. There was no
  published deprecation policy, no sunset headers, and no end-of-life notice — the surface was
  simply turned off.
status: end-of-life
status_note: >-
  SDK binaries remain downloadable from Maven Central and npm, and the SDK reference remains
  online on Zendrive Inc's own Bitbucket Pages workspace, but no integration can be completed:
  SDK setup validates the application key against Zendrive's servers, and no new key can be
  obtained because the signup host no longer resolves.
