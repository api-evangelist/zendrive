source: >-
  https://central.sonatype.com/artifact/com.zendrive.sdk.android/ZendriveSDK ;
  https://registry.npmjs.org/react-native-zendrive ;
  https://zendrive-root.bitbucket.io/ios/docs/latest/index.html
name: Zendrive client libraries
description: >-
  Zendrive shipped a mobile-first product: the integration surface is a native Android/iOS
  SDK plus cross-platform wrappers, not an HTTP client library. The Android SDK is published
  first-party to Maven Central under the com.zendrive.sdk.android group; the React Native
  wrapper is published first-party to npm by "Zendrive Inc. <developers@zendrive.com>". The
  iOS SDK is NOT distributed through CocoaPods or Swift Package Manager — trunk.cocoapods.org
  returns "No pod found" for ZendriveSDK, Zendrive and ZendriveSDKSwift — it was distributed
  as a binary framework through the (now decommissioned) developer portal, so only its
  reference documentation survives. Every first-party package stopped publishing in
  June/July 2024, immediately around Intuit's 2024-07-11 close of the Zendrive technology
  acquisition; that is the abandonment signal, and it is provider-published and dated.
